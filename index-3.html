<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxim &amp; Bene – Präsentationen und mehr</title>
<meta name="description" content="Wir erstellen Präsentationen und mehr. Schick uns deinen Auftrag.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3efe7;
    --ink:#10243f;
    --coral:#f0654a;
    --line:#10243f;
    --field:#faf8f3;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter Tight","Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
  }
  .hero{
    position:relative;min-height:100svh;padding:clamp(20px,5vw,64px);
    display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  }
  .hero::after{
    content:"";position:absolute;right:0;bottom:0;
    width:min(62vw,720px);height:min(62vw,720px);
    background:var(--ink);clip-path:polygon(100% 0,100% 100%,0 100%);
    z-index:0;
  }
  h1{
    position:relative;z-index:1;margin:0;
    font-weight:800;letter-spacing:-.045em;line-height:.9;
    font-size:clamp(64px,17vw,230px);
  }
  .bottom{position:relative;z-index:1;padding-bottom:4px}
  .rule{display:flex;align-items:center;margin-bottom:28px}
  .rule i{flex:1;height:2px;background:var(--line)}
  .rule b{width:22px;height:22px;border-radius:50%;background:var(--coral);flex:none}
  .tag{margin:0 0 28px;color:var(--coral);font-weight:500;font-size:clamp(18px,2.4vw,28px)}
  .cta{
    display:inline-block;background:var(--coral);color:#fff;text-decoration:none;
    font-weight:700;font-size:18px;padding:14px 28px;border-radius:999px;
  }
  .cta:hover{background:var(--ink)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:3px solid var(--coral);outline-offset:3px;
  }

  .order{background:var(--ink);color:var(--paper);padding:clamp(24px,6vw,96px)}
  .wrap{max-width:720px;margin:0 auto}
  .order h2{margin:0 0 8px;font-size:clamp(36px,7vw,72px);letter-spacing:-.035em;line-height:1;font-weight:800}
  .order p.lead{margin:0 0 36px;opacity:.8;font-size:18px}
  form{display:grid;gap:18px}
  .row{display:grid;gap:18px;grid-template-columns:1fr 1fr}
  @media(max-width:600px){.row{grid-template-columns:1fr}}
  label{display:grid;gap:6px;font-weight:500;font-size:15px}
  input,select,textarea{
    font:inherit;color:var(--ink);background:var(--field);
    border:2px solid transparent;border-radius:10px;padding:13px 14px;width:100%;
  }
  textarea{min-height:150px;resize:vertical}
  .hp{position:absolute;left:-9999px;height:0;overflow:hidden}
  button{
    font:inherit;font-weight:700;font-size:18px;cursor:pointer;border:0;
    background:var(--coral);color:#fff;border-radius:999px;padding:15px 30px;justify-self:start;
  }
  button:hover{background:#fff;color:var(--ink)}
  button:disabled{opacity:.6;cursor:wait}
  .status{min-height:1.5em;font-weight:500}
  .status.ok{color:#9be3b0}
  .status.err{color:#ffb4a5}
  footer{background:var(--ink);color:var(--paper);opacity:.95;padding:0 clamp(24px,6vw,96px) 40px;font-size:14px}
  footer .wrap{border-top:1px solid rgba(243,239,231,.25);padding-top:20px}
  @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

  /* Support-Bot */
  #bot-toggle{
    position:fixed;right:18px;bottom:18px;z-index:50;
    background:var(--coral);color:#fff;border:0;border-radius:999px;
    padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;
    box-shadow:0 4px 14px rgba(16,36,63,.35);
  }
  #bot-toggle:hover{background:var(--paper);color:var(--ink)}
  #bot{
    position:fixed;right:18px;bottom:78px;z-index:50;
    width:min(380px,calc(100vw - 36px));height:min(520px,calc(100svh - 110px));
    background:var(--paper);color:var(--ink);border-radius:16px;overflow:hidden;
    display:none;flex-direction:column;box-shadow:0 8px 30px rgba(16,36,63,.4);
  }
  #bot.open{display:flex}
  #bot header{background:var(--ink);color:var(--paper);padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  #bot header button{background:none;border:0;color:var(--paper);font-size:22px;padding:0 4px;cursor:pointer;line-height:1;justify-self:auto}
  #bot header button:hover{background:none;color:var(--coral)}
  #bot-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.4;white-space:pre-wrap}
  .msg.bot{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
  .msg.me{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:4px}
  .quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 10px}
  .quick button{
    background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;
    padding:6px 12px;font-size:14px;font-weight:500;cursor:pointer;justify-self:auto;
  }
  .quick button:hover{background:var(--coral);border-color:var(--coral);color:#fff}
  #bot-form{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(16,36,63,.2);background:#fff}
  #bot-form input{flex:1;padding:10px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--field)}
  #bot-form button{padding:10px 16px;font-size:15px;justify-self:auto}
</style>
</head>
<body>

<header class="hero">
  <h1>Maxim<br>&amp; Bene</h1>
  <div class="bottom">
    <div class="rule" aria-hidden="true"><i></i><b></b></div>
    <p class="tag">Wir erstellen Präsentationen und mehr.</p>
    <a class="cta" href="#auftrag">Auftrag senden</a>
  </div>
</header>

<main>
  <section class="order" id="auftrag">
    <div class="wrap">
      <h2>Dein Auftrag</h2>
      <p class="lead">Beschreib kurz, was du brauchst. Wir melden uns per E-Mail bei dir.</p>

      <form id="form" novalidate>
        <div class="row">
          <label>Dein Name
            <input name="Name" type="text" autocomplete="name" required>
          </label>
          <label>Deine E-Mail
            <input name="email" type="email" autocomplete="email" required>
          </label>
        </div>
        <div class="row">
          <label>Was brauchst du?
            <select name="Art" required>
              <option value="">Bitte wählen</option>
              <option>Präsentation</option>
              <option>Webseite</option>
              <option>Poster / Flyer</option>
              <option>Etwas anderes</option>
            </select>
          </label>
          <label>Bis wann?
            <input name="Deadline" type="date">
          </label>
        </div>
        <label>Worum geht es?
          <textarea name="Beschreibung" placeholder="Thema, Umfang, Wünsche …" required></textarea>
        </label>

        <!-- Spam-Falle: bleibt leer -->
        <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

        <button type="submit" id="send">Auftrag senden</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">Maxim &amp; Bene</div>
</footer>

<script>
  // ====== HIER EINTRAGEN ======
  const EMAIL_MAXIM = "maximwibe16@gmail.com";  // bekommt jeden Auftrag
  const EMAIL_BENE  = "Ivonne.clobesscholz@icloud.com";   // bekommt jeden Auftrag als Kopie
  // ============================

  // ====== FILTER ======
  // Wörter, die du hier ergänzt, werden blockiert (klein geschrieben, ohne Umlaute).
  const BAD_LONG = [
    "hurensohn","arschloch","wichser","fotze","schlampe","missgeburt","vollidiot",
    "spasti","drecksau","scheisskerl","fickdich","verpissdich","halts maul",
    "bastard","motherfucker","asshole","bitch","fuck","cunt","nigger","nazi","heilhitler"
  ];
  const BAD_SHORT = ["hure","depp","idiot","spast","penner","lauch","kacke","fick","sau"];
  const COOLDOWN_MS = 60 * 1000; // 1 Auftrag pro Minute

  function normalize(s) {
    return s.toLowerCase()
      .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
      .replace(/0/g,"o").replace(/1/g,"i").replace(/3/g,"e").replace(/4/g,"a")
      .replace(/5/g,"s").replace(/@/g,"a").replace(/\$/g,"s");
  }

  function checkContent(fd) {
    const parts = ["Name","email","Beschreibung"].map(k => String(fd.get(k) || ""));
    const raw = parts.join(" ");
    const norm = normalize(raw);
    const collapsed = norm.replace(/[^a-z]/g, "");   // "h u r e n s o h n" -> "hurensohn"
    const words = norm.split(/[^a-z]+/).filter(Boolean);

    if (BAD_LONG.some(w => collapsed.includes(w.replace(/ /g,"")))) return "Bitte formuliere deinen Auftrag freundlich.";
    if (words.some(w => BAD_SHORT.includes(w))) return "Bitte formuliere deinen Auftrag freundlich.";
    if (/(https?:\/\/|www\.|\.(com|ru|xyz|top|click)\b)/i.test(String(fd.get("Beschreibung")))) return "Bitte schreib keine Links in den Auftrag.";
    if (/(.)\1{7,}/.test(raw)) return "Bitte schreib deinen Auftrag in normalen Worten.";
    if (String(fd.get("Beschreibung")).trim().length < 15) return "Bitte beschreib deinen Auftrag etwas genauer (mindestens 15 Zeichen).";
    try {
      const last = Number(localStorage.getItem("lastOrder") || 0);
      if (Date.now() - last < COOLDOWN_MS) return "Bitte warte kurz, bevor du den nächsten Auftrag sendest.";
    } catch (e) {}
    return null;
  }

  const form = document.getElementById("form");
  const btn = document.getElementById("send");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.className = "status";
    if (!form.checkValidity()) {
      status.textContent = "Bitte fülle Name, E-Mail, Art und Beschreibung aus.";
      status.classList.add("err");
      form.reportValidity();
      return;
    }
    const problem = checkContent(new FormData(form));
    if (problem) {
      status.textContent = problem;
      status.classList.add("err");
      return;
    }
    const data = new FormData(form);
    data.append("_subject", "Neuer Auftrag von " + data.get("Name"));
    data.append("_cc", EMAIL_BENE);
    data.append("_template", "table");
    data.append("_captcha", "false");

    btn.disabled = true;
    status.textContent = "Wird gesendet …";
    try {
      const res = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(EMAIL_MAXIM), {
        method: "POST",
        headers: { "Accept": "application/json" },
        body: data
      });
      const json = await res.json();
      if (res.ok && (json.success === true || json.success === "true")) {
        try { localStorage.setItem("lastOrder", String(Date.now())); } catch (e) {}
        form.reset();
        status.textContent = "Gesendet. Wir melden uns bei dir.";
        status.classList.add("ok");
      } else {
        throw new Error(json.message || "Fehler");
      }
    } catch (err) {
      status.textContent = "Das hat nicht geklappt. Bitte versuche es gleich noch einmal.";
      status.classList.add("err");
    } finally {
      btn.disabled = false;
    }
  });
</script>
<button id="bot-toggle" type="button" aria-expanded="false" aria-controls="bot">Hilfe</button>
<section id="bot" aria-label="Support-Bot">
  <header><span>Support von Maxim &amp; Bene</span><button type="button" id="bot-close" aria-label="Schließen">×</button></header>
  <div id="bot-msgs" aria-live="polite"></div>
  <div class="quick" id="bot-quick"></div>
  <form id="bot-form" autocomplete="off">
    <input id="bot-input" type="text" placeholder="Deine Frage …" aria-label="Deine Frage">
    <button type="submit">Senden</button>
  </form>
</section>

<script>
(function () {
  // ====== WISSEN DES BOTS (hier kannst du Antworten ändern oder ergänzen) ======
  const FAQ = [
    { keys: ["hallo","hi","hey","moin","servus","guten tag"],
      answer: "Hallo! Ich bin der Support-Bot von Maxim & Bene. Frag mich etwas zu unseren Aufträgen." },
    { keys: ["wer seid","wer bist","ueber euch","über euch","maxim","bene"],
      answer: "Wir sind Maxim & Bene. Wir erstellen Präsentationen und mehr." },
    { keys: ["was macht","was bietet","angebot","leistung","koennt ihr","könnt ihr","praesentation","präsentation","webseite","website","poster","flyer"],
      answer: "Wir erstellen Präsentationen, Webseiten, Poster und Flyer. Du hast etwas anderes im Kopf? Schreib es einfach in dein Auftragsformular." },
    { keys: ["auftrag","bestellen","bestellung","anfrage","beauftragen","senden","abschicken"],
      answer: "So gibst du einen Auftrag auf:\n1. Öffne das Formular „Dein Auftrag“.\n2. Gib Name, E-Mail und Art ein.\n3. Beschreib kurz, worum es geht.\n4. Tippe auf „Auftrag senden“.",
      action: "form" },
    { keys: ["preis","kosten","kostet","teuer","bezahlen","geld","euro"],
      answer: "Der Preis hängt vom Umfang ab. Beschreib deinen Auftrag im Formular, dann melden wir uns mit einem Angebot.",
      action: "form" },
    { keys: ["dauer","wie lange","schnell","frist","deadline","bis wann","fertig"],
      answer: "Trag im Formular bei „Bis wann?“ dein Wunschdatum ein. Wir melden uns und sagen dir, ob es klappt." },
    { keys: ["kontakt","erreichen","email","e-mail","mail","melden","antwort"],
      answer: "Am besten über das Auftragsformular. Wir melden uns per E-Mail bei der Adresse, die du dort einträgst. Schau auch im Spam-Ordner nach." ,
      action: "form" },
    { keys: ["fehler","klappt nicht","geht nicht","funktioniert nicht","problem","bug","kaputt","error"],
      answer: "Wenn das Formular nicht abgeschickt wird, prüf bitte:\n• Name, E-Mail, Art und Beschreibung sind ausgefüllt.\n• Die Beschreibung hat mindestens 15 Zeichen.\n• Keine Links und keine Beleidigungen im Text.\n• Seit deinem letzten Auftrag ist mindestens eine Minute vergangen.\nKlappt es danach immer noch nicht, versuch es später noch einmal." },
    { keys: ["danke","dankeschoen","dankeschön","super","cool","top"],
      answer: "Gern! Wenn du noch etwas wissen willst, frag einfach." },
    { keys: ["tschuess","tschüss","bye","ciao","bis dann"],
      answer: "Tschüss und bis bald!" }
  ];
  const FALLBACK = "Das weiß ich leider nicht. Schick uns bitte einen Auftrag oder deine Frage über das Formular, dann antworten Maxim und Bene dir persönlich.";
  const QUICK = ["Wie gebe ich einen Auftrag auf?", "Was kostet das?", "Was macht ihr?", "Wie lange dauert es?", "Das Formular geht nicht"];
  // =============================================================================

  const toggle = document.getElementById("bot-toggle");
  const box = document.getElementById("bot");
  const msgs = document.getElementById("bot-msgs");
  const quick = document.getElementById("bot-quick");
  const input = document.getElementById("bot-input");
  let greeted = false;

  const norm = s => s.toLowerCase().trim();

  function add(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  function addFormButton() {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Zum Formular";
    b.style.cssText = "align-self:flex-start;background:#f0654a;color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer";
    b.addEventListener("click", () => {
      box.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
      document.getElementById("auftrag").scrollIntoView({ behavior: "smooth" });
    });
    msgs.appendChild(b);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function answerFor(q) {
    const t = norm(q);
    let best = null, bestScore = 0;
    for (const item of FAQ) {
      let score = 0;
      for (const k of item.keys) if (t.includes(k)) score += k.length;
      if (score > bestScore) { bestScore = score; best = item; }
    }
    return best;
  }

  function ask(q) {
    q = q.trim();
    if (!q) return;
    add(q, "me");
    const hit = answerFor(q);
    setTimeout(() => {
      add(hit ? hit.answer : FALLBACK, "bot");
      if (!hit || hit.action === "form") addFormButton();
    }, 350);
  }

  QUICK.forEach(q => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = q;
    b.addEventListener("click", () => ask(q));
    quick.appendChild(b);
  });

  function open() {
    box.classList.add("open");
    toggle.setAttribute("aria-expanded", "true");
    if (!greeted) {
      greeted = true;
      add("Hallo! Ich bin der Support-Bot von Maxim & Bene. Wie kann ich helfen?", "bot");
    }
    input.focus();
  }
  function close() {
    box.classList.remove("open");
    toggle.setAttribute("aria-expanded", "false");
  }

  toggle.addEventListener("click", () => box.classList.contains("open") ? close() : open());
  document.getElementById("bot-close").addEventListener("click", close);
  document.getElementById("bot-form").addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value;
    input.value = "";
    ask(v);
  });
})();
</script>
</body>
</html>
